name: Build static (Pages-ready)

# Builds dist/ on every main push. Full GitHub Pages deploy needs a public repo
# (or Pro) — private free repos return 422 for Pages. Artifact is available for
# itch.io / manual hosting. Set repo variable ENABLE_GH_PAGES=true after making
# the repo Pages-capable to attempt deploy-pages.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: static-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run content:validate
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 14
      - uses: actions/upload-pages-artifact@v3
        if: ${{ vars.ENABLE_GH_PAGES == 'true' }}
        with:
          path: dist

  deploy:
    if: ${{ vars.ENABLE_GH_PAGES == 'true' }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
